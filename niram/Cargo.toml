# Niram: Remus rewritten in Rust, one engine for each Remus version.
#
# rules/ holds what every version shares: the board, the rules of chess, FEN, SAN,
# the opening book, the evaluation terms, move ordering, the transposition table,
# the search helpers, the UCI loop, and the benchmark. Each color folder holds one
# engine: its evaluate(), its search, and its think(), like the station folders
# of instructor/Stations.
[workspace]
resolver = "3"
members = [
    "rules",
    "WHITE - No enhancements",
    "RED - Transposition table",
    "GREEN - Opening book",
    "BLUE - Killer moves",
    "PINK - Principal variation search",
    "YELLOW - Draw sense",
    "PURPLE - Pawn structure",
    "CYAN - Mating bonus",
    "ORANGE - Null-move pruning",
    "BROWN - Late move reductions",
    "GRAY - King safety",
    "GOLD - All enhancements",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"

[profile.release]
debug = false
