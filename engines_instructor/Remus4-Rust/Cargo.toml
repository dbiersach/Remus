# Remus4-Rust: Remus4 rewritten in Rust.
#
# Each file in src/ is named after the Remus4 Python file it matches, and main.rs
# matches uci.py. The engine searches the same tree as Remus4, position for position,
# until its table fills, so speed and a larger table are the only differences.
[package]
name = "remus4_rust"
description = "Remus4 in Rust: the same search and evaluation, many times faster"
version = "1.0.0"
edition = "2024"

# Remus4-Rust uses the Rust standard library only, as Remus4 uses Python's.
[dependencies]

# The release profile, every switch set for speed:
#   opt-level = 3      the highest optimization level
#   codegen-units = 1  compile the program as one piece, so any function can be inlined
#   lto = "fat"        optimize across every module at link time
#   panic = "abort"    leave out the code that unwinds the stack after a bug
#   strip = true       leave the symbol table out of the program
# The workshop designer's build_rust.py adds profile-guided optimization.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
strip = true
