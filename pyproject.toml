[project]
name = "remus"
version = "0.1.0"
description = 'Remus - a pure Python teaching chess engine for the "Turning a Chess Engine into Science AI" workshop'
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The engine uses the standard library only, so it has no runtime dependencies.
dependencies = []

[dependency-groups]
# python-chess is a reference tool: tests use it as an external cross-check of
# the native move generator, and it may drive an optional display layer. The
# engine never imports it.
dev = ["chess>=1.11,<2", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
lint.extend-select = ["I", "C4", "ISC", "SIM", "TCH"]
# TC002 and TC003 ask for imports used only in type hints to move into an
# "if TYPE_CHECKING:" block. Remus imports them plainly, so students read one
# import style everywhere.
lint.ignore = ["TC002", "TC003"]
# A student stub keeps the imports its finished version needs, as hints, so
# unused imports are allowed in student/.
lint.per-file-ignores = { "student/**" = ["F401"] }
show-fixes = true
target-version = "py314"

# Each period folder is a complete copy of Remus, so module names repeat from folder
# to folder. Run one folder at a time, such as
# uv run pytest "instructor/Day 06 - Count positions with perft/period2", or
# run_all_tests.py for all.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
