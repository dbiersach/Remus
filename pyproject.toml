[project]
name = "remus"
version = "0.1.0"
description = 'Remus - a pure Python teaching chess engine for the "Turning a Chess Engine into Science AI" workshop'
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The engine uses the standard library only, so it has no runtime dependencies.
dependencies = []

[dependency-groups]
# python-chess is a reference tool: tests use it as an external cross-check of
# the native move generator, and it may drive an optional display layer. The
# engine never imports it.
dev = ["chess>=1.11,<2", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
lint.extend-select = ["I", "C4", "ISC", "SIM", "TCH"]
# TC002 and TC003 ask for imports used only in type hints to move into an
# "if TYPE_CHECKING:" block. Remus imports them plainly, so students read one
# import style everywhere.
lint.ignore = ["TC002", "TC003"]
# A student stub keeps the imports its finished version needs, as hints, so
# unused imports are allowed in student/. A student lab file (python_*.py) holds a
# lone # on each line the pair types, so its blanks and the variables they would
# use stay as they are, and the formatter leaves the file alone. A demo file
# (demo_*.py) follows the same pattern. The imports a lab needs stay in the student
# file, so the pair's blanks can use them.
lint.per-file-ignores = { "student/**" = ["F401"], "**/python_*.py" = ["F401", "F841", "PLR2044"], "**/demo_*.py" = ["F401", "F841", "PLR2044"] }
format.exclude = [
    "student/**/python_*.py",
    "student/**/demo_*.py",
]
show-fixes = true
target-version = "py314"

# Each period folder is a complete copy of Remus, so module names repeat from folder
# to folder. Run one folder at a time, such as
# uv run pytest "instructor/Day 06 - Count positions and read FEN/period2", or
# scripts/run_all_tests.py for all.
[tool.pytest.ini_options]
testpaths = ["scripts"]
addopts = "-q"

# version_league.py and version_elo.py in scripts/ import version_match.py from
# instructor/Remus, where every pair runs it in the Day 10 tournament.
[tool.pyright]
executionEnvironments = [
    { root = "scripts", extraPaths = ["instructor/Remus"] },
]
