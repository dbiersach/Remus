[project]
name = "remus"
version = "0.1.0"
description = "Remus - a pure Python teaching chess engine for the Turbo GameWorks Chess Workshop"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The engine uses the standard library only, so it has no runtime dependencies.
dependencies = []

[dependency-groups]
# python-chess is a reference tool: tests use it as an external cross-check of
# the native move generator, and it may drive an optional display layer. The
# engine never imports it.
dev = ["chess>=1.11,<2", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
lint.extend-select = ["I", "C4", "ISC", "SIM", "TCH"]
lint.ignore = []
show-fixes = true
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["remus"]
addopts = "-q"
